name: Alerte Vertretungsplan 5d

on:
  # Aucun déclenchement automatique côté GitHub. Le planificateur externe
  # (cron-job.org) appelle ce workflow via l'API workflow_dispatch, DE LA
  # MÊME FAÇON à tout moment (un seul cronjob, body {"ref":"main"}, sans
  # paramètre) : c'est le script Python qui détecte l'heure d'exécution
  # (heure de Berlin) et choisit lui-même le mode adéquat.
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'exécution ('auto' = détection horaire par le script)"
        required: true
        type: choice
        default: auto
        options:
          - auto
          - soir
          - matin
          - journee

# Un seul run à la fois : évite que deux appels proches écrivent le fichier
# d'état en même temps.
concurrency:
  group: vertretungsplan-5d
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verifier-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer le script
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          # Vide quand cron-job.org appelle sans inputs -> le script
          # détecte l'heure lui-même. Renseigné seulement pour les tests
          # manuels depuis l'interface GitHub.
          MODE: ${{ github.event.inputs.mode }}
        run: python alerte_vertretung_5d.py

      - name: Sauvegarder l'état
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- etat_vertretung_5d.json || true
          git diff --staged --quiet || git commit -m "Mise à jour état Vertretungsplan 5d"
          git push
