name: Alerte Vertretungsplan 5d

on:
  # Aucun déclenchement automatique côté GitHub : c'est crontab.org qui
  # appelle ce workflow via l'API GitHub, en indiquant le mode d'exécution
  # dans client_payload.mode (voir les instructions données à côté).
  repository_dispatch:
    types: [verifier-plan]
  workflow_dispatch:
    # Pour pouvoir tester manuellement depuis l'interface GitHub, avec un
    # mode choisi dans une liste.
    inputs:
      mode:
        description: "Mode d'exécution"
        required: true
        type: choice
        options:
          - soir
          - matin
          - journee

permissions:
  contents: write

jobs:
  verifier-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer le script
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          MODE: ${{ github.event.client_payload.mode || github.event.inputs.mode }}
        run: python alerte_vertretung_5d.py

      - name: Sauvegarder l'état
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- etat_vertretung_5d.json || true
          git diff --staged --quiet || git commit -m "Mise à jour état Vertretungsplan 5d"
          git push
