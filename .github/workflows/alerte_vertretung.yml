name: Alerte Vertretungsplan 5d

on:
  schedule:
    - cron: '*/10 5-19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verifier-plan:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: pip install requests

      - name: Lancer le script
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: python alerte_vertretung_5d.py

      - name: Sauvegarder l'état
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- etat_vertretung_5d.json || true
          git diff --staged --quiet || git commit -m "Mise à jour état Vertretungsplan 5d"
          git push

